name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun run build
      - name: Compare compiled binary with Bun
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then export BUNINBUN_BINARY=dist/buninbun.exe; else export BUNINBUN_BINARY=dist/buninbun; fi
          bun run test
          BENCH_ITERATIONS=3 BENCH_WARMUPS=1 bun run benchmark
